# Dashboard «Carga solar» del addon Solar Charger Balancer (v1.4, requiere addon ≥ 0.9.0).
# Tarjetas de HACS que usa: Mushroom, ApexCharts Card, mini-graph-card,
# Multiple Entity Row, auto-entities, Bubble Card (ventanas emergentes) y Energy Custom Graph Card.
# Pestañas: «Hoy» (datos en vivo y del día en curso), «Estadísticas» (más de un día) y
# «Datadis» (cuadre con los datos de la distribuidora, vía la integración e-data).
# Uso: abrir el panel → ✏️ → ⋮ → Editor de configuración en bruto → pegar todo → Guardar.
title: Carga solar
views:
  - title: Hoy
    path: carga-solar
    icon: mdi:solar-power-variant
    type: sections
    max_columns: 3
    sections:
      # ================================================================== AHORA
      - type: grid
        cards:
          - type: heading
            heading: Ahora
            icon: mdi:solar-power-variant
            badges:
              - type: entity
                entity: binary_sensor.solar_charger_cargador_en_linea
                color: green
              - type: entity
                entity: sensor.solar_charger_precio_actual
                show_icon: true
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: switch.solar_charger_control_automatico
                content_info: name
                icon_color: green
                tap_action: { action: toggle }
              - type: template
                icon: mdi:calendar-clock
                icon_color: >-
                  {{ 'orange' if states('sensor.solar_charger_carga_forzada_estado') != 'Sin carga programada' else 'grey' }}
                content: >-
                  {% set s = states('sensor.solar_charger_carga_forzada_estado') %}
                  {{ 'Forzada: en curso' if s.startswith('En curso') else 'Forzada: programada' if s.startswith('Programada') else 'Carga forzada' }}
                tap_action: { action: navigate, navigation_path: "#carga-forzada" }
              - type: template
                icon: mdi:text-box-outline
                content: Registro
                tap_action: { action: navigate, navigation_path: "#registro" }
              - type: template
                icon: mdi:cog
                content: Ajustes
                tap_action: { action: navigate, navigation_path: /08a79b05_solar_charger_balancer }
          - type: custom:mushroom-template-card
            entity: sensor.solar_charger_modo
            primary: "{{ states(entity) }}"
            secondary: "{{ state_attr(entity, 'motivo') or 'Esperando la primera decisión' }}"
            multiline_secondary: true
            icon: >-
              {% set m = states(entity) %}
              {{ 'mdi:ev-station' if 'cargando' in m or 'forzada' in m else
                 'mdi:car-off' if 'desconectado' in m else
                 'mdi:hand-back-right' if 'Manual' in m else 'mdi:timer-sand' }}
            color: >-
              {% set m = states(entity) %}
              {{ 'red' if 'sin conexión' in m else 'green' if 'cargando' in m else
                 'orange' if 'forzada' in m else 'grey' }}
            tap_action: { action: more-info }
            grid_options: { columns: full }
          - type: custom:mushroom-template-card
            entity: sensor.solar_charger_potencia_placas
            primary: "{{ '%.2f' | format(states(entity) | float(0)) | replace('.', ',') }} kW"
            secondary: Placas
            icon: mdi:solar-panel
            color: amber
          - type: custom:mushroom-template-card
            entity: sensor.solar_charger_potencia_hogar
            primary: "{{ '%.2f' | format(states(entity) | float(0)) | replace('.', ',') }} kW"
            secondary: Hogar
            icon: mdi:home-lightning-bolt
            color: blue
          - type: custom:mushroom-template-card
            entity: sensor.solar_charger_potencia_cargador
            primary: "{{ '%.2f' | format(states(entity) | float(0)) | replace('.', ',') }} kW"
            secondary: "Coche · {{ states('sensor.solar_charger_intensidad_objetivo') | int(0) }} A"
            icon: mdi:car-electric
            color: teal
          - type: custom:mushroom-template-card
            entity: sensor.solar_charger_potencia_red
            primary: "{{ '%.2f' | format(states(entity) | float(0) | abs) | replace('.', ',') }} kW"
            secondary: "{{ 'Red · comprando' if states(entity) | float(0) > 0.02 else 'Red · vertiendo' }}"
            icon: mdi:transmission-tower
            color: "{{ 'red' if states(entity) | float(0) > 0.02 else 'green' }}"
          - type: custom:mushroom-template-card
            entity: sensor.solar_charger_balance_hora
            primary: >-
              Saldo de esta hora: {{ '%+.2f' | format((states(entity) | float(0)) / 1000) | replace('.', ',') }} kWh
            secondary: >-
              Quedan {{ states('sensor.solar_charger_minutos_restantes_hora') }} min. Si cierra en verde, el coche no ha usado red.
            multiline_secondary: true
            icon: mdi:scale-balance
            color: "{{ 'green' if states(entity) | float(0) >= 0 else 'red' }}"
            grid_options: { columns: full }
          - type: custom:mini-graph-card
            name: Últimas 6 horas (kW)
            icon: mdi:chart-bell-curve-cumulative
            hours_to_show: 6
            points_per_hour: 12
            line_width: 2
            height: 110
            hour24: true
            decimals: 2
            show:
              state: false
              fill: fade
              legend: true
              labels: hover
            entities:
              - entity: sensor.solar_charger_potencia_placas
                name: Placas
                color: "#F2A93B"
              - entity: sensor.solar_charger_potencia_hogar
                name: Hogar
                color: "#5B8BD0"
              - entity: sensor.solar_charger_potencia_cargador
                name: Coche
                color: "#2FB5A0"
            grid_options: { columns: full }

      # ================================================================== POR DÍA (con paginador)
      # El selector de fechas cambia el día de la gráfica «Neto por hora» (timespan: energy).
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Por día
            icon: mdi:chart-bar
          - type: energy-date-selection
            grid_options: { columns: full }
          - type: custom:energy-custom-graph-card
            title: Neto por hora
            grid_options: { columns: full }
            timespan:
              mode: energy
            aggregation:
              compute_current_hour: true
              fallback: hour
            header:
              chip:
                metric:
                  source: series
                  series_id: neto
                  reducer: last
                label: Neto de la hora
                unit: kWh
            series:
              - statistic_id: sensor.pasillo_principal_energia_shelly_principal_acumulados
                id: hogar
                name: Hogar
                chart_type: bar
                stat_type: change
                stack: Net
                color: --energy-grid-consumption-color
              - statistic_id: sensor.beny_charger_220300221_cargador_energia_acumulado
                id: coche
                name: Coche
                chart_type: bar
                stat_type: change
                stack: Net
                color: --energy-battery-in-color
              - id: solar
                name: Solar
                chart_type: bar
                source: calculation
                calculation:
                  terms:
                    - operation: subtract
                      statistic_id: sensor.fv_mi_parte_energia_hoy
                      stat_type: change
                stack: Net
              # Neto de cada hora = hogar + coche − solar. Por encima de 0 se compra a la red;
              # por debajo, se vierte. Línea continua y sin relleno para que se lea el valor exacto.
              - id: neto
                name: Neto (+ compra / − vierte)
                chart_type: line
                source: calculation
                calculation:
                  terms:
                    - operation: add
                      statistic_id: sensor.pasillo_principal_energia_shelly_principal_acumulados
                      stat_type: change
                    - operation: add
                      statistic_id: sensor.beny_charger_220300221_cargador_energia_acumulado
                      stat_type: change
                    - operation: subtract
                      statistic_id: sensor.fv_mi_parte_energia_hoy
                      stat_type: change
                stack: Net
                fill: false
                line_style: solid
                line_width: 3
                line_opacity: 1
                color: --error-color
                show_in_legend: true
                show_in_tooltip: true

      # ================================================================== HOY
      - type: grid
        cards:
          - type: heading
            heading: Hoy
            icon: mdi:calendar-today
          - type: custom:mushroom-template-card
            entity: sensor.solar_charger_coste_hoy
            primary: >-
              Coste de hoy: {{ '%.2f' | format(states(entity) | float(0)) | replace('.', ',') }} €
            secondary: >-
              {%- set sv = state_attr('sensor.solar_charger_valor_solar_autoconsumida', 'hoy') | float(0) %}
              {%- set ex = state_attr('sensor.solar_charger_descuento_excedentes', 'hoy') | float(0) %}
              Solar usada {{ '%.2f' | format(sv) | replace('.', ',') }} € ·
              excedentes {{ ('−' if ex >= 0.005 else '') ~ ('%.2f' | format(ex) | replace('.', ',')) }} € · con impuestos
            multiline_secondary: true
            icon: mdi:receipt-text
            color: blue
            grid_options: { columns: full }
          - type: custom:mushroom-template-card
            entity: sensor.solar_charger_cobertura_solar_hoy
            primary: >-
              {{ (states(entity) | float | round(0) | int ~ ' %') if is_number(states(entity)) else '—' }}
            secondary: Cobertura solar
            icon: mdi:solar-power
            color: "{{ 'green' if states(entity) | float(0) >= 60 else 'orange' }}"
          - type: custom:mushroom-template-card
            entity: sensor.solar_charger_coche_cargado_hoy
            primary: "{{ '%.1f' | format(states(entity) | float(0)) | replace('.', ',') }} kWh"
            secondary: >-
              {%- set s = states('sensor.solar_charger_coche_solar_hoy') %}
              Coche{% if is_number(s) %} · {{ s | float | round(0) | int }} % solar{% endif %}
            icon: mdi:ev-plug-type2
            color: teal
          - type: custom:mushroom-template-card
            entity: sensor.solar_charger_bateria_coche_estimada
            primary: "Batería ≈ {{ states(entity) | float(0) | round(0) | int }} %"
            secondary: >-
              Último dato del coche: {{ state_attr(entity, 'ultimo_dato_real') | int(0) }} %
            icon: >-
              {% set n = ((states(entity) | float(0)) / 10) | round(0) | int * 10 %}
              {{ 'mdi:battery' if n >= 100 else 'mdi:battery-outline' if n <= 0 else 'mdi:battery-' ~ n }}
            color: teal
            grid_options: { columns: full }

      # ================================================================== VENTANAS EMERGENTES
      # Se abren desde los botones de «Ahora»; no ocupan sitio en el panel.
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: pop-up
            hash: "#carga-forzada"
            name: Carga forzada
            icon: mdi:calendar-clock
            cards:
              - type: custom:auto-entities
                show_empty: false
                card:
                  type: entities
                  title: Previsión solar (Open-Meteo)
                filter:
                  include:
                    - integration: open_meteo_solar_forecast
                      entity_id: "*_energy_production_today"
                      options: { name: Hoy }
                    - integration: open_meteo_solar_forecast
                      entity_id: "*_energy_production_today_remaining"
                      options: { name: Queda hoy }
                    - integration: open_meteo_solar_forecast
                      entity_id: "*_energy_production_tomorrow"
                      options: { name: Mañana }
              - type: entities
                title: Programar
                state_color: true
                entities:
                  - entity: sensor.solar_charger_carga_forzada_estado
                    name: Estado
                  - entity: text.solar_charger_carga_forzada_inicio
                    name: Inicio (HH:MM o AAAA-MM-DD HH:MM)
                  - entity: number.solar_charger_carga_forzada_duracion
                    name: Duración
                  - entity: number.solar_charger_carga_forzada_intensidad
                    name: Intensidad
                  - type: buttons
                    entities:
                      - entity: button.solar_charger_programar_carga_forzada
                        name: Programar
                        icon: mdi:calendar-plus
                        tap_action:
                          action: perform-action
                          perform_action: button.press
                          target: { entity_id: button.solar_charger_programar_carga_forzada }
                      - entity: button.solar_charger_cancelar_carga_forzada
                        name: Cancelar
                        icon: mdi:calendar-remove
                        tap_action:
                          action: perform-action
                          perform_action: button.press
                          target: { entity_id: button.solar_charger_cancelar_carga_forzada }
                  - type: divider
                  - entity: switch.solar_charger_control_automatico
                    name: Control automático
          - type: custom:bubble-card
            card_type: pop-up
            hash: "#registro"
            name: Registro
            icon: mdi:text-box-outline
            cards:
              - type: markdown
                content: >-
                  {% set evs = (state_attr('sensor.solar_charger_ultimo_evento', 'eventos') or [])
                     | rejectattr('level', 'eq', 'debug') | list %}
                  {% for e in evs[:20] %}
                  {{ '🔴' if e.level == 'error' else '🟠' if e.level == 'warning' else '•' }}
                  **{{ e.time }}** · {{ e.text }}

                  {% else %}Sin eventos{% endfor %}

  - title: Estadísticas
    path: estadisticas
    icon: mdi:chart-box-outline
    type: sections
    max_columns: 3
    sections:
      # ================================================================== CONSUMO (30 DÍAS Y MES)
      # Selector General / Coche / Hogar (entidad del addon): cambia el resumen y las gráficas.
      # Una gráfica por origen, cada una con su escala, para que las cargas grandes de la red
      # no aplasten las de sol.
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Consumo
            icon: mdi:chart-bar
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                content: General
                icon: mdi:home-lightning-bolt-outline
                icon_color: "{{ 'amber' if is_state('select.solar_charger_vista_estadisticas', 'General') else 'disabled' }}"
                tap_action:
                  action: perform-action
                  perform_action: select.select_option
                  target: { entity_id: select.solar_charger_vista_estadisticas }
                  data: { option: General }
              - type: template
                content: Coche
                icon: mdi:car-electric
                icon_color: "{{ 'teal' if is_state('select.solar_charger_vista_estadisticas', 'Coche') else 'disabled' }}"
                tap_action:
                  action: perform-action
                  perform_action: select.select_option
                  target: { entity_id: select.solar_charger_vista_estadisticas }
                  data: { option: Coche }
              - type: template
                content: Hogar
                icon: mdi:home
                icon_color: "{{ 'blue' if is_state('select.solar_charger_vista_estadisticas', 'Hogar') else 'disabled' }}"
                tap_action:
                  action: perform-action
                  perform_action: select.select_option
                  target: { entity_id: select.solar_charger_vista_estadisticas }
                  data: { option: Hogar }
          - type: custom:mushroom-template-card
            entity: sensor.solar_charger_historico_diario
            primary: >-
              {%- set k = {'Coche': 'coche', 'Hogar': 'hogar'}.get(states('select.solar_charger_vista_estadisticas'), 'total') %}
              {%- set d = state_attr(entity, 'dias') or [] %}
              {%- set t = (d | sum(attribute=k ~ '_solar')) + (d | sum(attribute=k ~ '_red')) %}
              {{ {'coche': 'Coche', 'hogar': 'Hogar', 'total': 'Consumo total'}[k] }} · 30 días: {{ '%.1f' | format(t) | replace('.', ',') }} kWh
            secondary: >-
              {%- set k = {'Coche': 'coche', 'Hogar': 'hogar'}.get(states('select.solar_charger_vista_estadisticas'), 'total') %}
              {%- set d = state_attr(entity, 'dias') or [] %}
              {%- set sol = d | sum(attribute=k ~ '_solar') %}
              {%- set red = d | sum(attribute=k ~ '_red') %}
              {%- set m = state_attr(entity, 'mes') or {} %}
              {%- set ms = m.get(k ~ '_solar', 0) | float(0) %}
              {%- set mr = m.get(k ~ '_red', 0) | float(0) %}
              Con sol {{ '%.1f' | format(sol) | replace('.', ',') }} kWh
              ({{ ((100 * sol / (sol + red)) | round(0) | int) if sol + red > 0 else 0 }} %) ·
              de la red {{ '%.1f' | format(red) | replace('.', ',') }} kWh ·
              este mes {{ '%.1f' | format(ms + mr) | replace('.', ',') }} kWh,
              {{ ((100 * ms / (ms + mr)) | round(0) | int) if ms + mr > 0 else 0 }} % solar
            multiline_secondary: true
            icon: >-
              {{ {'Coche': 'mdi:car-electric', 'Hogar': 'mdi:home'}.get(states('select.solar_charger_vista_estadisticas'), 'mdi:home-lightning-bolt-outline') }}
            color: amber
            grid_options: { columns: full }
          - type: conditional
            grid_options: { columns: full }
            conditions:
              - condition: state
                entity: select.solar_charger_vista_estadisticas
                state: General
            card:
              type: custom:apexcharts-card
              graph_span: 30d
              span: { end: day }
              header:
                show: true
                title: "Consumo total: con sol (kWh/día)"
              apex_config:
                chart: { height: 200 }
                plotOptions: { bar: { columnWidth: "70%", borderRadius: 3 } }
                legend: { show: false }
                dataLabels: { enabled: false }
                xaxis: { labels: { format: "dd/MM" } }
                tooltip: { x: { format: "ddd dd/MM" } }
              yaxis:
                - min: 0
                  decimals: 1
              series:
                - entity: sensor.solar_charger_historico_diario
                  name: Con sol
                  type: column
                  color: "#F2A93B"
                  unit: kWh
                  float_precision: 1
                  data_generator: |
                    return (entity.attributes.dias || []).map(d => [new Date(d.d + "T12:00:00").getTime(), d.total_solar]);
                  show: { legend_value: false }
          - type: conditional
            grid_options: { columns: full }
            conditions:
              - condition: state
                entity: select.solar_charger_vista_estadisticas
                state: General
            card:
              type: custom:apexcharts-card
              graph_span: 30d
              span: { end: day }
              header:
                show: true
                title: "Consumo total: de la red (kWh/día)"
              apex_config:
                chart: { height: 200 }
                plotOptions: { bar: { columnWidth: "70%", borderRadius: 3 } }
                legend: { show: false }
                dataLabels: { enabled: false }
                xaxis: { labels: { format: "dd/MM" } }
                tooltip: { x: { format: "ddd dd/MM" } }
              yaxis:
                - min: 0
                  decimals: 1
              series:
                - entity: sensor.solar_charger_historico_diario
                  name: De la red
                  type: column
                  color: "#8A94A6"
                  unit: kWh
                  float_precision: 1
                  data_generator: |
                    return (entity.attributes.dias || []).map(d => [new Date(d.d + "T12:00:00").getTime(), d.total_red]);
                  show: { legend_value: false }
          - type: conditional
            grid_options: { columns: full }
            conditions:
              - condition: state
                entity: select.solar_charger_vista_estadisticas
                state: General
            card:
              type: custom:apexcharts-card
              graph_span: 30d
              span: { end: day }
              header:
                show: true
                title: Cobertura solar diaria (%) · línea verde = objetivo
              apex_config:
                chart: { height: 200 }
                legend: { show: false }
                dataLabels: { enabled: false }
                xaxis: { labels: { format: "dd/MM" } }
                tooltip: { x: { format: "ddd dd/MM" } }
                annotations:
                  yaxis:
                    # «y» entre comillas: el editor de HA lee «y» sin comillas como true (YAML 1.1).
                    - "y": 60
                      borderColor: "#4CAF6A"
                      strokeDashArray: 4
              yaxis:
                - min: 0
                  max: 100
                  decimals: 0
              series:
                - entity: sensor.solar_charger_historico_diario
                  name: Cobertura solar
                  type: area
                  color: "#2FB5A0"
                  stroke_width: 2
                  unit: "%"
                  float_precision: 0
                  data_generator: |
                    return (entity.attributes.dias || []).map(d => [new Date(d.d + "T12:00:00").getTime(), d.cob]);
                  show: { legend_value: false }
          - type: conditional
            grid_options: { columns: full }
            conditions:
              - condition: state
                entity: select.solar_charger_vista_estadisticas
                state: Coche
            card:
              type: custom:apexcharts-card
              graph_span: 30d
              span: { end: day }
              header:
                show: true
                title: "Coche: con sol (kWh/día)"
              apex_config:
                chart: { height: 200 }
                plotOptions: { bar: { columnWidth: "70%", borderRadius: 3 } }
                legend: { show: false }
                dataLabels: { enabled: false }
                xaxis: { labels: { format: "dd/MM" } }
                tooltip: { x: { format: "ddd dd/MM" } }
              yaxis:
                - min: 0
                  decimals: 1
              series:
                - entity: sensor.solar_charger_historico_diario
                  name: Con sol
                  type: column
                  color: "#F2A93B"
                  unit: kWh
                  float_precision: 1
                  data_generator: |
                    return (entity.attributes.dias || []).map(d => [new Date(d.d + "T12:00:00").getTime(), d.coche_solar]);
                  show: { legend_value: false }
          - type: conditional
            grid_options: { columns: full }
            conditions:
              - condition: state
                entity: select.solar_charger_vista_estadisticas
                state: Coche
            card:
              type: custom:apexcharts-card
              graph_span: 30d
              span: { end: day }
              header:
                show: true
                title: "Coche: de la red (kWh/día)"
              apex_config:
                chart: { height: 200 }
                plotOptions: { bar: { columnWidth: "70%", borderRadius: 3 } }
                legend: { show: false }
                dataLabels: { enabled: false }
                xaxis: { labels: { format: "dd/MM" } }
                tooltip: { x: { format: "ddd dd/MM" } }
              yaxis:
                - min: 0
                  decimals: 1
              series:
                - entity: sensor.solar_charger_historico_diario
                  name: De la red
                  type: column
                  color: "#8A94A6"
                  unit: kWh
                  float_precision: 1
                  data_generator: |
                    return (entity.attributes.dias || []).map(d => [new Date(d.d + "T12:00:00").getTime(), d.coche_red]);
                  show: { legend_value: false }
          - type: conditional
            grid_options: { columns: full }
            conditions:
              - condition: state
                entity: select.solar_charger_vista_estadisticas
                state: Hogar
            card:
              type: custom:apexcharts-card
              graph_span: 30d
              span: { end: day }
              header:
                show: true
                title: "Hogar: con sol (kWh/día)"
              apex_config:
                chart: { height: 200 }
                plotOptions: { bar: { columnWidth: "70%", borderRadius: 3 } }
                legend: { show: false }
                dataLabels: { enabled: false }
                xaxis: { labels: { format: "dd/MM" } }
                tooltip: { x: { format: "ddd dd/MM" } }
              yaxis:
                - min: 0
                  decimals: 1
              series:
                - entity: sensor.solar_charger_historico_diario
                  name: Con sol
                  type: column
                  color: "#F2A93B"
                  unit: kWh
                  float_precision: 1
                  data_generator: |
                    return (entity.attributes.dias || []).map(d => [new Date(d.d + "T12:00:00").getTime(), d.hogar_solar]);
                  show: { legend_value: false }
          - type: conditional
            grid_options: { columns: full }
            conditions:
              - condition: state
                entity: select.solar_charger_vista_estadisticas
                state: Hogar
            card:
              type: custom:apexcharts-card
              graph_span: 30d
              span: { end: day }
              header:
                show: true
                title: "Hogar: de la red (kWh/día)"
              apex_config:
                chart: { height: 200 }
                plotOptions: { bar: { columnWidth: "70%", borderRadius: 3 } }
                legend: { show: false }
                dataLabels: { enabled: false }
                xaxis: { labels: { format: "dd/MM" } }
                tooltip: { x: { format: "ddd dd/MM" } }
              yaxis:
                - min: 0
                  decimals: 1
              series:
                - entity: sensor.solar_charger_historico_diario
                  name: De la red
                  type: column
                  color: "#8A94A6"
                  unit: kWh
                  float_precision: 1
                  data_generator: |
                    return (entity.attributes.dias || []).map(d => [new Date(d.d + "T12:00:00").getTime(), d.hogar_red]);
                  show: { legend_value: false }

      # ================================================================== FACTURA
      - type: grid
        cards:
          - type: heading
            heading: Factura del mes
            icon: mdi:receipt-text
          - type: custom:mushroom-template-card
            entity: sensor.solar_charger_coste_mes
            primary: >-
              Este mes: {{ '%.2f' | format(states(entity) | float(0)) | replace('.', ',') }} €
            secondary: >-
              {%- set f = states('sensor.solar_charger_prevision_factura_mes') %}
              {%- if is_number(f) %}Previsión a fin de mes: {{ '%.2f' | format(f | float) | replace('.', ',') }} €
              {%- else %}Previsión: faltan días completos{% endif %} · toca para el desglose
            multiline_secondary: true
            icon: mdi:receipt-text-outline
            color: blue
            tap_action: { action: navigate, navigation_path: "#factura" }
            grid_options: { columns: full }
          - type: markdown
            grid_options: { columns: full }
            content: |
              {% macro e(v) %}{{ '%.2f' | format(v | float(0)) | replace('.', ',') }} €{% endmacro %}
              {% set sv = 'sensor.solar_charger_valor_solar_autoconsumida' %}
              {% set dx = 'sensor.solar_charger_descuento_excedentes' %}
              {% macro n(v) %}{{ ('−' ~ e(v)) if (v | float(0)) >= 0.005 else e(0) }}{% endmacro %}

              | | Ayer | Mes |
              |:--|--:|--:|
              | **Coste** | **{{ e(states('sensor.solar_charger_coste_ayer')) }}** | **{{ e(states('sensor.solar_charger_coste_mes')) }}** |
              | Solar usada ¹ | {{ e(state_attr(sv, 'ayer')) }} | {{ e(state_attr(sv, 'mes')) }} |
              | Excedentes ² | {{ n(state_attr(dx, 'ayer')) }} | {{ n(state_attr(dx, 'mes')) }} |

              En el año: solar usada {{ e(state_attr(sv, 'ano')) }} · excedentes {{ n(state_attr(dx, 'ano')) }}

              _¹ Lo que habría costado en la red. ² Rebaja en la factura. Todo con impuestos._
          - type: custom:apexcharts-card
            section_mode: true
            grid_options: { columns: full, rows: 5 }
            graph_span: 31d
            span: { start: month }
            header:
              show: true
              title: Coste de cada día con impuestos (€)
            apex_config:
              plotOptions: { bar: { columnWidth: "70%", borderRadius: 3 } }
              legend: { show: true, position: top }
              dataLabels: { enabled: false }
              xaxis: { labels: { format: "dd" } }
              tooltip: { shared: true, intersect: false, x: { format: "ddd dd/MM" } }
            yaxis:
              - min: 0
                decimals: 1
            series:
              # Datos del sensor «Previsión factura mes» (atributo dias: un elemento por día del mes).
              # Barra: lo que suma el día a la factura. Líneas: la parte fija (se paga aunque no
              # consumas) y la media de los días ya cerrados, para ver qué días se salen.
              - entity: sensor.solar_charger_prevision_factura_mes
                name: Coste del día
                type: column
                color: "#4A90D9"
                unit: €
                float_precision: 2
                data_generator: |
                  return (entity.attributes.dias || []).map(d => [new Date(d.d + "T12:00:00").getTime(), d.total]);
                show: { legend_value: false }
              - entity: sensor.solar_charger_prevision_factura_mes
                name: Parte fija
                type: line
                # Sin punto extra en «ahora»: un punto fuera de las 12:00 estrecha las barras.
                extend_to: false
                color: "#8A94A6"
                stroke_width: 2
                stroke_dash: 4
                unit: €
                float_precision: 2
                data_generator: |
                  // Potencia + bono social + contador, con los impuestos que les corresponden.
                  return (entity.attributes.dias || []).map(d => {
                    const base = d.fijo + d.energia;
                    const k = base > 0 ? d.total / base : 1;
                    return [new Date(d.d + "T12:00:00").getTime(), d.fijo * k];
                  });
                show: { legend_value: false }
              - entity: sensor.solar_charger_prevision_factura_mes
                name: Media del mes
                type: line
                extend_to: false
                color: "#E0A030"
                stroke_width: 2
                unit: €
                float_precision: 2
                data_generator: |
                  // Media de los días cerrados (sin hoy, que va a medias), dibujada en todo el mes.
                  const dias = entity.attributes.dias || [];
                  const n = new Date();
                  const hoy = `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, "0")}-${String(n.getDate()).padStart(2, "0")}`;
                  const cerrados = dias.filter(d => d.d < hoy);
                  if (!cerrados.length) return [];
                  const media = cerrados.reduce((s, d) => s + d.total, 0) / cerrados.length;
                  return dias.map(d => [new Date(d.d + "T12:00:00").getTime(), media]);
                show: { legend_value: false }
          - type: custom:apexcharts-card
            section_mode: true
            grid_options: { columns: full, rows: 4 }
            graph_span: 31d
            span: { start: month }
            header:
              show: true
              title: Acumulado del mes (€) · discontinua = previsión
            apex_config:
              legend: { show: true, position: top }
              dataLabels: { enabled: false }
              xaxis: { labels: { format: "dd" } }
              tooltip: { x: { format: "dd/MM" } }
            yaxis:
              - min: 0
                decimals: 0
            series:
              - entity: sensor.solar_charger_prevision_factura_mes
                name: Real
                type: line
                color: "#4A90D9"
                stroke_width: 3
                float_precision: 2
                data_generator: |
                  return (entity.attributes.dias || []).map(d => [new Date(d.d + "T12:00:00").getTime(), d.acum]);
                show: { legend_value: false }
              - entity: sensor.solar_charger_prevision_factura_mes
                name: Previsión
                type: line
                color: "#8A94A6"
                stroke_width: 2
                stroke_dash: 6
                float_precision: 2
                data_generator: |
                  return (entity.attributes.prevision || []).map(d => [new Date(d.d + "T12:00:00").getTime(), d.acum]);
                show: { legend_value: false }

      # ================================================================== FACTURA CON DATADIS
      # Datos del sensor «Factura con Datadis»: misma fórmula que la factura del addon, pero con el
      # consumo horario del contador (Datadis) y la solar asignada que mide el addon. Las horas que
      # Datadis aún no ha publicado (1–2 días) se completan con los sensores del addon.
      - type: grid
        cards:
          - type: heading
            heading: Factura con el contador
            icon: mdi:receipt-text-check
          - type: custom:mushroom-template-card
            entity: sensor.solar_charger_factura_con_datadis
            primary: >-
              {%- set v = states(entity) %}
              {%- if is_number(v) %}Con Datadis: {{ '%.2f' | format(v | float) | replace('.', ',') }} €
              {%- else %}Sin datos de Datadis este mes{% endif %}
            secondary: >-
              {%- set a = state_attr(entity, 'actual') or {} %}
              {%- set c = a.get('comparado') or {} %}
              {%- set u = a.get('datadis_hasta') or '' %}
              {%- if c %}Addon {{ '%.2f' | format(c.addon | float(0)) | replace('.', ',') }} € en las mismas horas ({{ '%+.2f' | format(c.dif | float(0)) | replace('.', ',') }} €) · {% endif %}
              {%- if u | length >= 10 %}contador hasta el {{ u[8:10] | int }}/{{ u[5:7] | int }} · {% endif %}toca para el detalle
            multiline_secondary: true
            icon: mdi:receipt-text-check
            color: teal
            tap_action: { action: navigate, navigation_path: "#factura-datadis" }
            grid_options: { columns: full }
          - type: markdown
            grid_options: { columns: full }
            content: |
              {% set s = 'sensor.solar_charger_factura_con_datadis' %}
              {% macro e(v) %}{{ '%.2f' | format(v | float(0)) | replace('.', ',') }} €{% endmacro %}
              {% macro f(d) %}{{ d[8:10] | int }}/{{ d[5:7] | int }}{% endmacro %}
              {% set a = state_attr(s, 'actual') or {} %}
              {% set p = state_attr(s, 'anterior') or {} %}

              | | Este mes | Mes anterior |
              |:--|--:|--:|
              | **Total** | **{{ e(a.get('total')) if a else '—' }}** | **{{ e(p.get('total')) if p else '—' }}** |
              | Días | {{ (f(a.desde) ~ '–' ~ f(a.hasta)) if a else '—' }} | {{ (f(p.desde) ~ '–' ~ f(p.hasta)) if p else '—' }} |
              | Importado | {{ ('%.1f' | format(a.importado_kwh) | replace('.', ',') ~ ' kWh') if a else '—' }} | {{ ('%.1f' | format(p.importado_kwh) | replace('.', ',') ~ ' kWh') if p else '—' }} |
              | Vertido | {{ ('%.1f' | format(a.vertido_kwh) | replace('.', ',') ~ ' kWh') if a else '—' }} | {{ ('%.1f' | format(p.vertido_kwh) | replace('.', ',') ~ ' kWh') if p else '—' }} |

              {%- set sin = (a.get('horas') or {}).get('sin_solar', 0) + (p.get('horas') or {}).get('sin_solar', 0) %}
              {%- if sin > 0 %}

              _⚠️ {{ sin }} horas sin dato de solar (ni del addon ni en las estadísticas de HA): se calculan sin sol y su coste sale por encima del real._
              {%- endif %}

      # ================================================================== IMPORTADO DE LA RED (30 DÍAS)
      # Solo la energía que se ha comprado a la red, separada entre coche y hogar, en kWh y en €.
      # Reparto de cada hora: el sol cubre primero el hogar; lo que falta se compra a la red.
      # Coste: precio del tramo de esa hora con impuesto eléctrico e IVA (sin potencia ni excedentes).
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Comprado a la red · 30 días
            icon: mdi:transmission-tower-import
          - type: markdown
            grid_options: { columns: full }
            content: |
              {% set d = state_attr('sensor.solar_charger_historico_diario', 'dias') or [] %}
              {% macro k(x) %}{{ '%.1f' | format(x) | replace('.', ',') }} kWh{% endmacro %}
              {% macro e(x) %}{{ '%.2f' | format(x) | replace('.', ',') }} €{% endmacro %}
              {% set ck = d | sum(attribute='coche_red') %}{% set hk = d | sum(attribute='hogar_red') %}
              {% set ce = d | selectattr('coche_red_eur', 'defined') | sum(attribute='coche_red_eur') %}
              {% set he = d | selectattr('hogar_red_eur', 'defined') | sum(attribute='hogar_red_eur') %}
              {% set te = ce + he %}

              | | Energía | Coste | Precio medio | Parte del coste |
              |:--|--:|--:|--:|--:|
              | 🚗 **Coche** | {{ k(ck) }} | **{{ e(ce) }}** | {{ ('%.3f' | format(ce / ck) | replace('.', ',')) if ck > 0 else '—' }} €/kWh | {{ ((100 * ce / te) | round(0) | int) if te > 0 else 0 }} % |
              | 🏠 **Hogar** | {{ k(hk) }} | **{{ e(he) }}** | {{ ('%.3f' | format(he / hk) | replace('.', ',')) if hk > 0 else '—' }} €/kWh | {{ ((100 * he / te) | round(0) | int) if te > 0 else 0 }} % |
              | **Total** | {{ k(ck + hk) }} | **{{ e(te) }}** | {{ ('%.3f' | format(te / (ck + hk)) | replace('.', ',')) if ck + hk > 0 else '—' }} €/kWh | |

              _Solo energía comprada a la red, al precio de su hora y con impuestos. No incluye potencia,
              bono social, contador ni el descuento por excedentes (están en «Factura del mes»)._
          - type: custom:apexcharts-card
            section_mode: true
            grid_options: { columns: full, rows: 5 }
            graph_span: 30d
            span: { end: day }
            stacked: true
            header:
              show: true
              title: Coste de la energía comprada por día (€)
            apex_config:
              plotOptions: { bar: { columnWidth: "70%", borderRadius: 2 } }
              legend: { show: true, position: top }
              dataLabels: { enabled: false }
              xaxis: { labels: { format: "dd/MM" } }
              tooltip: { shared: true, intersect: false, x: { format: "ddd dd/MM" } }
            yaxis:
              - min: 0
                decimals: 1
            series:
              - entity: sensor.solar_charger_historico_diario
                name: Coche
                type: column
                stack_group: red
                color: "#2FB5A0"
                unit: €
                float_precision: 2
                data_generator: |
                  return (entity.attributes.dias || []).map(d => [new Date(d.d + "T12:00:00").getTime(), d.coche_red_eur ?? 0]);
                show: { legend_value: false }
              - entity: sensor.solar_charger_historico_diario
                name: Hogar
                type: column
                stack_group: red
                color: "#5B8BD0"
                unit: €
                float_precision: 2
                data_generator: |
                  return (entity.attributes.dias || []).map(d => [new Date(d.d + "T12:00:00").getTime(), d.hogar_red_eur ?? 0]);
                show: { legend_value: false }
          - type: custom:apexcharts-card
            section_mode: true
            grid_options: { columns: full, rows: 4 }
            graph_span: 30d
            span: { end: day }
            stacked: true
            header:
              show: true
              title: Energía comprada por día (kWh)
            apex_config:
              plotOptions: { bar: { columnWidth: "70%", borderRadius: 2 } }
              legend: { show: true, position: top }
              dataLabels: { enabled: false }
              xaxis: { labels: { format: "dd/MM" } }
              tooltip: { shared: true, intersect: false, x: { format: "ddd dd/MM" } }
            yaxis:
              - min: 0
                decimals: 0
            series:
              - entity: sensor.solar_charger_historico_diario
                name: Coche
                type: column
                stack_group: red
                color: "#2FB5A0"
                unit: kWh
                float_precision: 2
                data_generator: |
                  return (entity.attributes.dias || []).map(d => [new Date(d.d + "T12:00:00").getTime(), d.coche_red ?? 0]);
                show: { legend_value: false }
              - entity: sensor.solar_charger_historico_diario
                name: Hogar
                type: column
                stack_group: red
                color: "#5B8BD0"
                unit: kWh
                float_precision: 2
                data_generator: |
                  return (entity.attributes.dias || []).map(d => [new Date(d.d + "T12:00:00").getTime(), d.hogar_red ?? 0]);
                show: { legend_value: false }

      # ================================================================== OBJETIVO ANUAL
      - type: grid
        cards:
          - type: heading
            heading: Objetivo anual
            icon: mdi:flag-checkered
          - type: gauge
            entity: sensor.solar_charger_cobertura_solar_ano
            name: Cobertura solar del año (objetivo 60 %)
            min: 0
            max: 100
            needle: true
            severity: { green: 60, yellow: 40, red: 0 }
            grid_options: { columns: full }
          - type: entities
            state_color: true
            entities:
              - entity: sensor.solar_charger_proyeccion_cobertura_ano
                type: custom:multiple-entity-row
                name: Cobertura
                icon: mdi:solar-power
                state_header: 31 dic
                format: precision0
                entities:
                  - entity: sensor.solar_charger_cobertura_solar_ayer
                    name: Ayer
                    format: precision0
                  - entity: sensor.solar_charger_cobertura_solar_mes
                    name: Mes
                    format: precision0
              - entity: sensor.solar_charger_faltan_para_objetivo
                name: Faltan para el 60 %
                icon: mdi:flag-checkered

      # ================================================================== VENTANA EMERGENTE
      # Desglose de la factura: se abre al tocar la tarjeta «Este mes».
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: pop-up
            hash: "#factura"
            name: Factura del mes
            icon: mdi:receipt-text
            cards:
              - type: markdown
                content: |
                  {% set m = 'sensor.solar_charger_coste_mes' %}
                  {% set f = 'sensor.solar_charger_prevision_factura_mes' %}
                  {% macro e(v) %}{{ '%.2f' | format(v | float(0)) | replace('.', ',') }} €{% endmacro %}
                  {% set desde = state_attr(m, 'desde') or '' %}

                  | Concepto | Importe |
                  |:--|--:|
                  | Potencia | {{ e(state_attr(m, 'potencia')) }} |
                  | Energía | {{ e(state_attr(m, 'energia')) }} |
                  | Excedentes | {{ e(state_attr(m, 'compensacion')) }} |
                  | Bono social y contador | {{ e(state_attr(m, 'bono_social_y_alquiler')) }} |
                  | Impuesto eléctrico | {{ e(state_attr(m, 'impuesto_electrico')) }} |
                  | IVA | {{ e(state_attr(m, 'iva')) }} |
                  {%- if (state_attr(m, 'solar_wallet') | float(0)) < 0 %}
                  | Solar Wallet | {{ e(state_attr(m, 'solar_wallet')) }} |
                  {%- endif %}
                  | **Total** | **{{ e(states(m)) }}** |

                  Importado {{ '%.1f' | format(state_attr(m, 'importado_kwh') | float(0)) | replace('.', ',') }} kWh · vertido {{ '%.1f' | format(state_attr(m, 'vertido_kwh') | float(0)) | replace('.', ',') }} kWh
                  {%- if desde | length == 10 %} · datos desde el {{ desde[8:10] | int }}/{{ desde[5:7] | int }}{% endif %}.

                  {% if is_number(states(f)) -%}
                  **Previsión a fin de mes: {{ e(states(f)) }}**. Media de {{ e(state_attr(f, 'media_diaria')) }}/día
                  (últimos {{ state_attr(f, 'dias_base') }} días completos)
                  {%- if (state_attr(f, 'dias_sin_datos') | int(0)) > 0 %}; incluye {{ state_attr(f, 'dias_sin_datos') }} días del mes sin datos, estimados con esa media{% endif %}.
                  {%- else -%}
                  La previsión aparecerá cuando haya al menos un día completo registrado.
                  {%- endif %}

          # Detalle de la factura con el consumo del contador: se abre al tocar «Con Datadis».
          - type: custom:bubble-card
            card_type: pop-up
            hash: "#factura-datadis"
            name: Factura con el contador
            icon: mdi:receipt-text-check
            cards:
              - type: markdown
                content: |
                  {% set s = 'sensor.solar_charger_factura_con_datadis' %}
                  {% macro e(v) %}{{ '%.2f' | format(v | float(0)) | replace('.', ',') }} €{% endmacro %}
                  {% macro k(v) %}{{ '%.1f' | format(v | float(0)) | replace('.', ',') }} kWh{% endmacro %}
                  {% macro f(d) %}{{ d[8:10] | int }}/{{ d[5:7] | int }}{% endmacro %}
                  {% set a = state_attr(s, 'actual') or {} %}
                  {% set p = state_attr(s, 'anterior') or {} %}
                  {% if not a and not p -%}
                  {{ state_attr(s, 'error') or 'Aún no hay datos de Datadis.' }}
                  {%- else -%}
                  | Concepto | Este mes | Mes anterior |
                  |:--|--:|--:|
                  {%- for key, name in [('potencia', 'Potencia'), ('energia', 'Energía'), ('compensacion', 'Excedentes'), ('bono_social_y_alquiler', 'Bono social y contador'), ('impuesto_electrico', 'Impuesto eléctrico'), ('iva', 'IVA'), ('solar_wallet', 'Solar Wallet')] %}
                  {%- if key != 'solar_wallet' or (a.get(key, 0) | float(0)) < 0 or (p.get(key, 0) | float(0)) < 0 %}
                  | {{ name }} | {{ e(a.get(key)) if a else '—' }} | {{ e(p.get(key)) if p else '—' }} |
                  {%- endif %}
                  {%- endfor %}
                  | **Total** | **{{ e(a.get('total')) if a else '—' }}** | **{{ e(p.get('total')) if p else '—' }}** |
                  | Días facturados | {{ a.get('dias', '—') if a else '—' }} | {{ p.get('dias', '—') if p else '—' }} |

                  **Energía comprada por periodo**

                  | Periodo | Este mes | € | Mes anterior | € |
                  |:--|--:|--:|--:|--:|
                  {%- set names = ((a.get('periodos') or []) + (p.get('periodos') or [])) | map(attribute='periodo') | unique | list %}
                  {%- for n in names %}
                  {%- set x = (a.get('periodos') or []) | selectattr('periodo', 'eq', n) | first | default({}) %}
                  {%- set y = (p.get('periodos') or []) | selectattr('periodo', 'eq', n) | first | default({}) %}
                  | {{ n }} | {{ k(x.kwh) if x else '—' }} | {{ e(x.eur) if x else '—' }} | {{ k(y.kwh) if y else '—' }} | {{ e(y.eur) if y else '—' }} |
                  {%- endfor %}

                  _€ de energía sin impuestos, al precio de cada periodo._

                  {%- for label, m in [('Este mes', a), ('Mes anterior', p)] if m %}
                  {%- set h = m.get('horas') or {} %}

                  **{{ label }}** ({{ f(m.desde) }}–{{ f(m.hasta) }}): {{ h.get('contador', 0) }} h con contador y solar del addon,
                  {{ h.get('solar_ha', 0) }} h con contador y solar de las estadísticas de HA (antes del addon),
                  {{ h.get('addon', 0) }} h solo addon (Datadis aún no las publica){% if h.get('sin_solar', 0) %},
                  {{ h.get('sin_solar') }} h sin solar registrada (calculadas sin sol){% endif %}.
                  {%- set c = m.get('comparado') %}
                  {%- if c %} Desde el {{ f(c.desde) }}, en las mismas horas: contador {{ e(c.contador) }} · addon {{ e(c.addon) }} ({{ '%+.2f' | format(c.dif | float(0)) | replace('.', ',') }} €).{% endif %}
                  {%- endfor %}
                  {%- endif %}
              - type: custom:apexcharts-card
                graph_span: 31d
                span: { start: month }
                header:
                  show: true
                  title: Coste de cada día (€) · contador frente a addon
                apex_config:
                  plotOptions: { bar: { columnWidth: "80%", borderRadius: 2 } }
                  legend: { show: true, position: top }
                  dataLabels: { enabled: false }
                  xaxis: { labels: { format: "dd" } }
                  tooltip: { shared: true, intersect: false, x: { format: "ddd dd/MM" } }
                yaxis:
                  - min: 0
                    decimals: 1
                series:
                  - entity: sensor.solar_charger_factura_con_datadis
                    name: Contador
                    type: column
                    color: "#2BA89A"
                    unit: €
                    float_precision: 2
                    data_generator: |
                      return ((entity.attributes.actual || {}).dias || []).map(d => [new Date(d.d + "T12:00:00").getTime(), d.total]);
                    show: { legend_value: false }
                  - entity: sensor.solar_charger_factura_con_datadis
                    name: Addon
                    type: column
                    color: "#4A90D9"
                    unit: €
                    float_precision: 2
                    data_generator: |
                      return ((entity.attributes.actual || {}).dias || []).filter(d => d.addon !== null).map(d => [new Date(d.d + "T12:00:00").getTime(), d.addon]);
                    show: { legend_value: false }

  - title: Datadis
    path: datadis
    icon: mdi:transmission-tower-import
    type: sections
    max_columns: 3
    sections:
      # ================================================================== CUADRE CON EL CONTADOR
      # Datos del sensor «Diferencia con Datadis» del addon, que lee las estadísticas de e-data.
      # Compara, hora a hora, el consumo del contador (hogar + coche, antes del reparto del
      # autoconsumo compartido) con lo que suman los sensores del hogar y del cargador.
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Cuadre con el contador
            icon: mdi:scale-balance
          - type: custom:mushroom-template-card
            entity: sensor.solar_charger_diferencia_con_datadis
            primary: >-
              {%- set v = states(entity) %}
              {%- if is_number(v) %}Diferencia con Datadis: {{ '%+.1f' | format(v | float) | replace('.', ',') }} %
              {%- else %}Sin datos de Datadis para comparar{% endif %}
            secondary: >-
              {%- set p = state_attr(entity, 'periodo') or {} %}
              {%- set u = state_attr(entity, 'ultimo_dato') or '' %}
              {%- set err = state_attr(entity, 'error') %}
              {%- if err %}{{ err }}{% else %}
              {{ p.get('dias', 0) }} días: contador {{ '%.1f' | format(p.get('datadis', 0) | float(0)) | replace('.', ',') }} kWh ·
              addon {{ '%.1f' | format(p.get('addon', 0) | float(0)) | replace('.', ',') }} kWh
              {%- if u | length >= 10 %} · Datadis hasta el {{ u[8:10] | int }}/{{ u[5:7] | int }}{% endif %}
              {%- endif %}
            multiline_secondary: true
            icon: mdi:scale-unbalanced
            color: >-
              {%- set v = states(entity) | float(99) | abs %}
              {{ 'green' if v <= 5 else 'orange' if v <= 10 else 'red' }}
            grid_options: { columns: full }
          - type: custom:apexcharts-card
            section_mode: true
            grid_options: { columns: full, rows: 5 }
            graph_span: 30d
            span: { end: day }
            header:
              show: true
              title: Consumo por día (kWh) · contador frente a addon
            apex_config:
              plotOptions: { bar: { columnWidth: "80%", borderRadius: 2 } }
              legend: { show: true, position: top }
              dataLabels: { enabled: false }
              xaxis: { labels: { format: "dd/MM" } }
              tooltip: { shared: true, intersect: false, x: { format: "ddd dd/MM" } }
            yaxis:
              - min: 0
                decimals: 0
            series:
              - entity: sensor.solar_charger_diferencia_con_datadis
                name: Contador (Datadis)
                type: column
                color: "#8A94A6"
                unit: kWh
                float_precision: 2
                data_generator: |
                  return (entity.attributes.dias || []).map(d => [new Date(d.d + "T12:00:00").getTime(), d.datadis]);
                show: { legend_value: false }
              - entity: sensor.solar_charger_diferencia_con_datadis
                name: Addon (hogar + coche)
                type: column
                color: "#4A90D9"
                unit: kWh
                float_precision: 2
                data_generator: |
                  return (entity.attributes.dias || []).map(d => [new Date(d.d + "T12:00:00").getTime(), d.addon]);
                show: { legend_value: false }
          - type: custom:apexcharts-card
            section_mode: true
            grid_options: { columns: full, rows: 4 }
            graph_span: 30d
            span: { end: day }
            header:
              show: true
              title: Diferencia por día (%) · franja = ±5 %
            apex_config:
              plotOptions: { bar: { columnWidth: "70%", borderRadius: 2 } }
              legend: { show: false }
              dataLabels: { enabled: false }
              xaxis: { labels: { format: "dd/MM" } }
              tooltip: { x: { format: "ddd dd/MM" } }
              annotations:
                yaxis:
                  - "y": -5
                    y2: 5
                    fillColor: "#4CAF6A"
                    opacity: 0.12
                    borderColor: transparent
            yaxis:
              - decimals: 0
            series:
              - entity: sensor.solar_charger_diferencia_con_datadis
                name: Diferencia
                type: column
                color: "#E0A030"
                unit: "%"
                float_precision: 1
                data_generator: |
                  return (entity.attributes.dias || []).map(d => [new Date(d.d + "T12:00:00").getTime(), d.dif_pct]);
                show: { legend_value: false }
          - type: markdown
            grid_options: { columns: full }
            content: |
              **Cómo leerlo.** Negativo = los sensores miden menos que el contador. Se comparan solo
              las horas que tienen los dos datos y los días con al menos 22 horas registradas por el addon.
              Datadis publica con 1–2 días de retraso.

              _e-data no recibe de Datadis el autoconsumo ni los excedentes de la instalación compartida
              (llegan a 0), así que aquí se cuadra el consumo; el reparto solar se comprueba con la factura._

      # ================================================================== MAXÍMETRO
      - type: grid
        cards:
          - type: heading
            heading: Potencia máxima
            icon: mdi:gauge
          - type: custom:mushroom-template-card
            entity: sensor.solar_charger_diferencia_con_datadis
            primary: >-
              {%- set m = state_attr(entity, 'maximetro') or [] %}
              {%- set p1 = m | selectattr('p1', 'defined') | map(attribute='p1') | list %}
              {%- set p2 = m | selectattr('p2', 'defined') | map(attribute='p2') | list %}
              Máx. 12 meses: punta {{ ('%.2f' | format(p1 | max) | replace('.', ',')) if p1 else '—' }} kW ·
              valle {{ ('%.2f' | format(p2 | max) | replace('.', ',')) if p2 else '—' }} kW
            secondary: >-
              {%- set c = state_attr(entity, 'potencia_contratada') or {} %}
              Contratada: {{ c.get('p1', '—') }} / {{ c.get('p2', '—') }} kW · maxímetro del contador (Datadis)
            multiline_secondary: true
            icon: mdi:gauge
            color: purple
            grid_options: { columns: full }
          - type: custom:apexcharts-card
            section_mode: true
            grid_options: { columns: full, rows: 5 }
            graph_span: 365d
            span: { end: month }
            header:
              show: true
              title: Máximo de cada mes (kW)
            apex_config:
              plotOptions: { bar: { columnWidth: "70%", borderRadius: 2 } }
              legend: { show: true, position: top }
              dataLabels: { enabled: false }
              xaxis: { labels: { format: "MMM" } }
              tooltip: { shared: true, intersect: false, x: { format: "MMMM yyyy" } }
            yaxis:
              - min: 0
                decimals: 1
            series:
              - entity: sensor.solar_charger_diferencia_con_datadis
                name: Punta (P1)
                type: column
                color: "#D9534F"
                unit: kW
                float_precision: 2
                data_generator: |
                  return (entity.attributes.maximetro || []).filter(m => m.p1 != null)
                    .map(m => [new Date(m.mes + "-15T12:00:00").getTime(), m.p1]);
                show: { legend_value: false }
              - entity: sensor.solar_charger_diferencia_con_datadis
                name: Valle (P2)
                type: column
                color: "#4A90D9"
                unit: kW
                float_precision: 2
                data_generator: |
                  return (entity.attributes.maximetro || []).filter(m => m.p2 != null)
                    .map(m => [new Date(m.mes + "-15T12:00:00").getTime(), m.p2]);
                show: { legend_value: false }
              - entity: sensor.solar_charger_diferencia_con_datadis
                name: Contratada
                type: line
                color: "#8A94A6"
                stroke_width: 2
                stroke_dash: 4
                extend_to: false
                unit: kW
                float_precision: 2
                data_generator: |
                  const c = (entity.attributes.potencia_contratada || {}).p1;
                  const m = entity.attributes.maximetro || [];
                  if (!c || !m.length) return [];
                  return m.map(x => [new Date(x.mes + "-15T12:00:00").getTime(), c]);
                show: { legend_value: false }
