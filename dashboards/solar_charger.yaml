# Dashboard de seguimiento del addon Solar Charger Balancer.
# Requiere (HACS): Mushroom y ApexCharts Card.
# Uso: Ajustes → Paneles → Añadir panel → "Nuevo panel desde cero" → ⋮ → Editar panel
#      → ⋮ → Editor de configuración en bruto → pegar este contenido.
title: Solar Charger
views:
  - title: Carga solar
    path: carga-solar
    icon: mdi:solar-power-variant
    type: sections
    max_columns: 3
    sections:
      # ---------------------------------------------------------------- Estado
      - type: grid
        cards:
          - type: heading
            heading: Estado
            icon: mdi:solar-power-variant
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: sensor.solar_charger_modo
                icon_color: teal
              - type: entity
                entity: sensor.solar_charger_intensidad_objetivo
                icon: mdi:current-ac
              - type: entity
                entity: binary_sensor.solar_charger_cargador_en_linea
                content_info: name
              - type: entity
                entity: sensor.solar_charger_precio_actual
                icon_color: amber
          - type: custom:mushroom-template-card
            primary: Placas
            secondary: "{{ states('sensor.solar_charger_potencia_placas') }} kW"
            icon: mdi:solar-panel
            icon_color: amber
            entity: sensor.solar_charger_potencia_placas
            layout: vertical
            grid_options: { columns: 6 }
          - type: custom:mushroom-template-card
            primary: Hogar
            secondary: "{{ states('sensor.solar_charger_potencia_hogar') }} kW"
            icon: mdi:home-lightning-bolt
            icon_color: blue
            entity: sensor.solar_charger_potencia_hogar
            layout: vertical
            grid_options: { columns: 6 }
          - type: custom:mushroom-template-card
            primary: Cargador
            secondary: "{{ states('sensor.solar_charger_potencia_cargador') }} kW"
            icon: mdi:ev-station
            icon_color: teal
            entity: sensor.solar_charger_potencia_cargador
            layout: vertical
            grid_options: { columns: 6 }
          - type: custom:mushroom-template-card
            primary: Red
            secondary: >-
              {% set g = states('sensor.solar_charger_potencia_red') | float(0) %}
              {{ '%+.2f' | format(g) }} kW · {{ 'importando' if g > 0 else 'vertiendo' }}
            icon: mdi:transmission-tower
            icon_color: >-
              {{ 'red' if states('sensor.solar_charger_potencia_red') | float(0) > 0 else 'green' }}
            entity: sensor.solar_charger_potencia_red
            layout: vertical
            grid_options: { columns: 6 }
          - type: custom:mushroom-template-card
            primary: >-
              Balance hora: {{ '%+d' | format(states('sensor.solar_charger_balance_hora') | int(0)) }} Wh
            secondary: >-
              Previsión al cierre {{ states('sensor.solar_charger_prevision_cierre_hora') }} Wh ·
              quedan {{ states('sensor.solar_charger_minutos_restantes_hora') }} min
            multiline_secondary: true
            icon: mdi:scale-balance
            icon_color: >-
              {{ 'green' if states('sensor.solar_charger_balance_hora') | int(0) >= 0 else 'red' }}
            entity: sensor.solar_charger_balance_hora
          - type: markdown
            content: >-
              **Decisión:** {{ state_attr('sensor.solar_charger_modo', 'motivo') or '—' }}

      # ---------------------------------------------------------------- Cobertura
      - type: grid
        cards:
          - type: heading
            heading: Cobertura solar (objetivo 60 %)
            icon: mdi:solar-power
          - type: gauge
            entity: sensor.solar_charger_cobertura_solar_hoy
            name: Hoy
            min: 0
            max: 100
            needle: true
            severity: { green: 60, yellow: 40, red: 0 }
            grid_options: { columns: 4 }
          - type: gauge
            entity: sensor.solar_charger_cobertura_solar_mes
            name: Mes
            min: 0
            max: 100
            needle: true
            severity: { green: 60, yellow: 40, red: 0 }
            grid_options: { columns: 4 }
          - type: gauge
            entity: sensor.solar_charger_cobertura_solar_ano
            name: Año
            min: 0
            max: 100
            needle: true
            severity: { green: 60, yellow: 40, red: 0 }
            grid_options: { columns: 4 }
          - type: entities
            entities:
              - entity: sensor.solar_charger_proyeccion_cobertura_ano
                name: Proyección a 31 dic
              - entity: sensor.solar_charger_autoconsumo_ano
                name: Autoconsumido este año
              - entity: sensor.solar_charger_consumo_total_ano
                name: Consumo total (hogar + cargador)
              - entity: sensor.solar_charger_faltan_para_objetivo
                name: Faltan para el objetivo

      # ---------------------------------------------------------------- Gráficos
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Hoy por horas
            icon: mdi:chart-bar
          - type: custom:apexcharts-card
            graph_span: 24h
            span: { start: day }
            header: { show: false }
            apex_config:
              chart: { height: 260 }
              legend: { show: true }
            yaxis:
              - min: 0
                decimals: 1
                apex_config: { title: { text: kWh } }
            series:
              - entity: sensor.solar_charger_generacion_hora
                name: Generación
                type: column
                color: "#f2a93b"
                group_by: { func: max, duration: 1h }
              - entity: sensor.solar_charger_consumo_hogar_hora
                name: Hogar
                type: column
                color: "#5b8bd0"
                group_by: { func: max, duration: 1h }
              - entity: sensor.solar_charger_consumo_cargador_hora
                name: Cargador
                type: column
                color: "#2fb5a0"
                group_by: { func: max, duration: 1h }
          - type: custom:apexcharts-card
            graph_span: 48h
            header: { show: true, title: Saldo neto por hora (Wh), show_states: false }
            apex_config:
              chart: { height: 220 }
            series:
              - entity: sensor.solar_charger_saldo_ultima_hora
                name: Saldo
                type: column
                group_by: { func: last, duration: 1h }
                color_threshold:
                  - { value: -100000, color: "#e0645c" }
                  - { value: 0, color: "#4caf6a" }

      # ---------------------------------------------------------------- Coche
      - type: grid
        cards:
          - type: heading
            heading: Coche
            icon: mdi:car-electric
          - type: custom:mushroom-entity-card
            entity: sensor.solar_charger_bateria_coche_estimada
            name: Batería estimada
            icon_color: teal
          - type: markdown
            content: >-
              Último dato real: {{ state_attr('sensor.solar_charger_bateria_coche_estimada', 'ultimo_dato_real') or '—' }} %
          - type: entities
            entities:
              - entity: sensor.solar_charger_coche_cargado_hoy
                name: Cargado hoy
              - entity: sensor.solar_charger_coche_solar_hoy
                name: De origen solar hoy
              - entity: sensor.solar_charger_coche_cargado_mes
                name: Cargado este mes
              - entity: sensor.solar_charger_coche_solar_mes
                name: De origen solar este mes

      # ---------------------------------------------------------------- Ahorro
      - type: grid
        cards:
          - type: heading
            heading: Ahorro estimado (sin impuestos)
            icon: mdi:piggy-bank
          - type: custom:mushroom-entity-card
            entity: sensor.solar_charger_ahorro_hoy
            name: Hoy
            layout: vertical
            grid_options: { columns: 4 }
          - type: custom:mushroom-entity-card
            entity: sensor.solar_charger_ahorro_mes
            name: Mes
            layout: vertical
            grid_options: { columns: 4 }
          - type: custom:mushroom-entity-card
            entity: sensor.solar_charger_ahorro_ano
            name: Año
            layout: vertical
            grid_options: { columns: 4 }

      # ---------------------------------------------------------------- Control
      - type: grid
        cards:
          - type: heading
            heading: Carga forzada
            icon: mdi:calendar-clock
          - type: entities
            state_color: true
            entities:
              - entity: switch.solar_charger_control_automatico
                name: Control automático
              - entity: sensor.solar_charger_carga_forzada_estado
                name: Estado
              - entity: text.solar_charger_carga_forzada_inicio
                name: Inicio (AAAA-MM-DD HH:MM o HH:MM)
              - entity: number.solar_charger_carga_forzada_duracion
                name: Duración
              - entity: number.solar_charger_carga_forzada_intensidad
                name: Intensidad
          - type: button
            entity: button.solar_charger_programar_carga_forzada
            name: Programar
            icon: mdi:calendar-plus
            tap_action:
              action: perform-action
              perform_action: button.press
              target: { entity_id: button.solar_charger_programar_carga_forzada }
            grid_options: { columns: 6 }
          - type: button
            entity: button.solar_charger_cancelar_carga_forzada
            name: Cancelar
            icon: mdi:calendar-remove
            tap_action:
              action: perform-action
              perform_action: button.press
              target: { entity_id: button.solar_charger_cancelar_carga_forzada }
            grid_options: { columns: 6 }

      # ---------------------------------------------------------------- Registro
      - type: grid
        cards:
          - type: heading
            heading: Decisiones e incidencias
            icon: mdi:text-box-outline
          - type: markdown
            content: >-
              {% set evs = state_attr('sensor.solar_charger_ultimo_evento', 'eventos') or [] %}
              {% for e in evs if e.level != 'debug' %}
              {{ '🔴' if e.level == 'error' else '🟠' if e.level == 'warning' else '🟢' }}
              **{{ e.time }}** {{ e.text }}

              {% else %}Sin eventos{% endfor %}
